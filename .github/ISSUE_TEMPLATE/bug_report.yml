name: Bug report
description: Something in Passaver doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. **Never paste passwords, usernames, vault files (`vault.bin`, `device.key`) or your computer's name here.** Use placeholders such as `name@example.com`.

        Found a security problem? Please report it privately through **Security → Report a vulnerability**, not here.
  - type: input
    id: version
    attributes:
      label: Passaver version
      description: Shown at the bottom of the Security tab in the popup.
      placeholder: "1.3.0"
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options: [Google Chrome, Microsoft Edge, Brave, Chromium, Other Chromium browser]
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options: [Windows 11, Windows 10]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If it happens on a specific site, give its address. Don't include anything you type into it.
      placeholder: |
        1. Open https://accounts.example.com/login
        2. Click the email field
        3. …
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no passwords, usernames, vault files or computer names.
          required: true
